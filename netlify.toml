# Netlify reads this automatically. No settings to change in the Netlify dashboard.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # Loreline is a plain static site, so Netlify's Next.js server plugin isn't needed.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
